[package]
name = "competitive16-web-helper"
version = "0.1.0"
edition = "2021"
description = "Native web match launcher for Counter-Strike 1.3 and 1.6"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }
goblin = "0.9"
ureq = { version = "2", features = ["json", "tls"] }
url = "2"
fs2 = "0.4"
sys-locale = "0.3"
regex = "1"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
libdbus-sys = { version = "0.2.7", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
