[package]
name = "competitive16-web-helper"
version = "0.1.0"
edition = "2021"
description = "Native web match launcher for Counter-Strike 1.3 and 1.6"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "tls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
