name: Verify web renderer

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: grep -RFq '.grid-cols-3' dist-web/assets --include='*.css'
      - run: npm run lint
