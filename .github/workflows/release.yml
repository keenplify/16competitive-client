name: Release desktop client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure the tag matches the calendar version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const tag=process.env.RELEASE_TAG.slice(1); const version=require('./package.json').version; if (!/^\\d{4}\\.(?:\\d{1,2}\\.\\d{1,2}|\\d{3,4}\\.\\d+)$/.test(tag) || tag !== version) throw new Error('Tag must use a supported calendar version and match package.json (' + version + ')')"
      - run: npm run typecheck
      - run: npm run lint

  package:
    needs: verify-version
    environment: Prod
    env:
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      HELPER_REPOSITORY: ${{ vars.HELPER_REPOSITORY }}
      GH_TOKEN: ${{ secrets.HELPER_RELEASE_READ_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: windows-release
          - os: ubuntu-latest
            command: npm run build:linux
            artifact: linux-appimage-release
          - os: ubuntu-latest
            command: npm run build:linux:arm64
            artifact: linux-arm64-appimage-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: ${{ matrix.command }}
      - name: Verify release backend target
        run: node --experimental-strip-types scripts/check-release-backend.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/latest*.yml
            dist/*-renderer-win-*.asar
            dist/renderer-update-*.unsigned.json
          if-no-files-found: error

  web-helper:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: competitive16-web-helper.exe
          - os: ubuntu-latest
            asset: competitive16-web-helper-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check web helper source changes
        id: changes
        run: node scripts/web-helper-release.mjs
      - name: Reuse previous release asset when source is unchanged
        id: reuse
        if: steps.changes.outputs.changed == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.changes.outputs.previous_tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          if gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir .; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Previous asset unavailable; rebuilding the helper.'
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.ready != 'true'
      - run: cargo test --manifest-path web-helper/Cargo.toml --locked
        if: steps.reuse.outputs.ready != 'true'
      - run: cargo build --manifest-path web-helper/Cargo.toml --release --locked
        if: steps.reuse.outputs.ready != 'true'
      - name: Name Windows binary
        if: runner.os == 'Windows' && steps.reuse.outputs.ready != 'true'
        shell: bash
        run: cp web-helper/target/release/competitive16-web-helper.exe "${{ matrix.asset }}"
      - name: Name Linux binary
        if: runner.os == 'Linux' && steps.reuse.outputs.ready != 'true'
        run: cp web-helper/target/release/competitive16-web-helper "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: web-helper-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [package, web-helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" > release-notes.md
      - name: Create GitHub Release and upload updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(release-assets/*)
          if [[ ! -e "${assets[0]}" ]]; then
            echo 'No release assets were downloaded.' >&2
            exit 1
          fi

          # Keep release creation separate from asset uploads. GitHub can return
          # HTTP 500 after creating the release, so check for an existing release
          # before retrying and make uploads safe to repeat.
          release_ready=false
          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_ready=true
              break
            fi
            if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md; then
              release_ready=true
              break
            fi
            echo "Release creation failed (attempt $attempt/3); retrying..." >&2
            sleep 5
          done

          if [[ "$release_ready" != true ]]; then
            echo "Could not create or find release $RELEASE_TAG." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            echo "Release asset upload failed (attempt $attempt/3); retrying..." >&2
            sleep 5
          done

          echo "Could not upload release assets for $RELEASE_TAG." >&2
          exit 1
