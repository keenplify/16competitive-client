name: Release desktop client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure the tag matches the calendar version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const tag=process.env.RELEASE_TAG.slice(1); const version=require('./package.json').version; if (!/^\\d{4}\\.(?:\\d{1,2}\\.\\d{1,2}|\\d{3,4}\\.\\d+)$/.test(tag) || tag !== version) throw new Error('Tag must use a supported calendar version and match package.json (' + version + ')')"
      - run: npm run typecheck
      - run: npm run lint

  package:
    needs: verify-version
    environment: Prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: windows-release
          - os: ubuntu-latest
            command: npm run build:linux
            artifact: linux-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - name: Reject localhost backend in release bundle
        shell: bash
        run: >-
          node -e "const bundle=require('node:fs').readFileSync('out/main/index.js','utf8');
          if (bundle.includes('http://127.0.0.1:3000'))
          throw new Error('Release bundle targets the local development backend')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" > release-notes.md
      - name: Create GitHub Release and upload updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_TAG" --notes-file release-notes.md
